name: release-dry-run
on:
  pull_request:
    paths: ['.github/workflows/release.yml', 'ci/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', 'editors/vscode/**', 'book/**']
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft from an existing version tag
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, rustflags: ''}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, rustflags: ''}
          - {runner: macos-15, target: aarch64-apple-darwin, rustflags: ''}
          - {runner: macos-15-intel, target: x86_64-apple-darwin, rustflags: ''}
          - {runner: windows-2022, target: x86_64-pc-windows-msvc, rustflags: '-C target-feature=+crt-static'}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target "$TARGET" -p based-cli -p based-lsp
      - name: Package and verify extracted binaries
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then args+=(--tag "${GITHUB_REF#refs/tags/}"); fi
          cargo run --locked -p based-ci -- package --binary-dir "target/$TARGET/release" \
            --output "$RUNNER_TEMP/native-assets" --target "$TARGET" "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: based-native-${{ matrix.target }}
          path: ${{ runner.temp }}/native-assets/*
          if-no-files-found: error
  source-consumer:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - run: cargo build --locked -p based-cli -p based-lsp
      - uses: actions/download-artifact@v4
        with:
          name: based-native-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/native
      - run: |
          mkdir "$RUNNER_TEMP/installed"
          tar -xzf "$RUNNER_TEMP/native/"*.tar.gz -C "$RUNNER_TEMP/installed"
          cargo run --locked -p based-ci -- source-consumer --based "$RUNNER_TEMP/installed/based"
  vsix:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: based-native-x86_64-unknown-linux-gnu
          path: native
      - run: make ci-extension
      - run: |
          mkdir native/installed
          tar -xzf native/*.tar.gz -C native/installed
          cd editors/vscode
          BASED_LSP="$GITHUB_WORKSPACE/native/installed/based-lsp" xvfb-run -a npm run test:installed
      - run: cargo run --locked -p based-ci -- extension editors/vscode "$RUNNER_TEMP/vsix-assets"
      - uses: actions/upload-artifact@v4
        with:
          name: based-vsix
          path: ${{ runner.temp }}/vsix-assets/*
          if-no-files-found: error
  collect:
    needs: [native, source-consumer, vsix]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: based-native-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets
      - uses: actions/download-artifact@v4
        with:
          name: based-vsix
          path: ${{ runner.temp }}/release-assets
      - run: cargo run --locked -p based-ci -- collect "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@v4
        with:
          name: based-release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
  draft:
    needs: collect
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.create_draft == true)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: based-release-assets
          path: assets
      - name: Create draft for owner review
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" assets/* --draft --verify-tag --title "Based $TAG" --notes-file book/src/upgrading.md
