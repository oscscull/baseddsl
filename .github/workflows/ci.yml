# CI — a THIN example wrapper. The substance lives in the portable `make` targets
# (see Makefile); this file only provisions infra (DB service containers, a Node toolchain)
# and calls those targets. Anyone on GitLab/Buildkite/a laptop runs the same `make` targets;
# this is the demonstration, not the pipeline logic. Keep it thin — no bespoke marketplace
# choreography, just services + `make`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: make ci-onboarding

  initializer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: make ci-initializer

  consumer-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: make ci-consumer-build

  cargo-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: make ci-cargo-generation

  runtime-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: make ci-runtime-benchmark

  # Infra-free gate: fmt + clippy + the full test suite.
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Prebuilt nextest binary, so `ensure-nextest` in the Makefile doesn't compile it from source.
      - uses: taiki-e/install-action@nextest
      - run: make ci-workspace

  # Build + package the VS Code extension so it never rots.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: make ci-extension

  # Build the `based serve` container image + smoke-boot it against bundled SQLite. Docker is preinstalled on ubuntu-latest; no DB service needed.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make ci-image

  # Live MariaDB: the integration suite + `based migrate apply` against a service container.
  # The suite honors TEST_MARIADB_URL (set by the make target from MARIADB_URL) and connects
  # to this service instead of spinning its own container.
  live-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: based_test_pw
          MARIADB_DATABASE: based_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make ci-live-mariadb MARIADB_URL=mysql://root:based_test_pw@127.0.0.1:3306/based_test
      - run: TEST_MARIADB_URL=mysql://root:based_test_pw@127.0.0.1:3306/based_test cargo test -p based-cli --test serve_idempotency_live mariadb_

  # Live Postgres: the integration suite against a service container (TEST_POSTGRES_URL).
  live-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: based_test_pw
          POSTGRES_DB: based_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make ci-live-postgres POSTGRES_URL=postgres://postgres:based_test_pw@127.0.0.1:5432/based_test
      - run: TEST_POSTGRES_URL=postgres://postgres:based_test_pw@127.0.0.1:5432/based_test cargo test -p based-cli --test serve_idempotency_live postgres_

  # The example scenarios end-to-end: the three quickstarts (`based migrate apply` then
  # `cargo run`) plus the axum-helpdesk smoke (reset -> migrate -> seed -> drive every route
  # over real HTTP), each against a fresh service container (SQLite runs on a throwaway file,
  # no service needed; the helpdesk resets the shared Postgres itself, so it runs last).
  examples:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: based_test_pw
          MARIADB_DATABASE: based_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: based_test_pw
          POSTGRES_DB: based_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=12
      # The optional Redis integration is tested alongside the default DbStore.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: >-
          make ci-examples
          MARIADB_URL=mysql://root:based_test_pw@127.0.0.1:3306/based_test
          POSTGRES_URL=postgres://postgres:based_test_pw@127.0.0.1:5432/based_test
          REDIS_URL=redis://127.0.0.1:6379

  database-tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make ci-database-tls

  # Fresh Cargo consumers compile in a separate tier, outside the fast workspace gate.
  generated-consumers:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: based_test_pw
          MARIADB_DATABASE: based_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: based_test_pw
          POSTGRES_DB: based_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: >-
          make ci-generated-consumer-sqlite ci-generated-consumer-mariadb ci-generated-consumer-postgres
          MARIADB_URL=mysql://root:based_test_pw@127.0.0.1:3306/based_test
          POSTGRES_URL=postgres://postgres:based_test_pw@127.0.0.1:5432/based_test

  typescript-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: make ci-typescript-guards
