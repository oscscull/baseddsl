[package]
name = "consumer-build-cost"
version = "0.0.0"
edition = "2021"

[workspace]

[features]
default = []
embedded = ["dep:based-runtime"]
cargo-generation = ["embedded", "dep:based-build"]
direct = ["dep:sqlx", "dep:uuid"]

[build-dependencies]
based-build = { path = "../../../crates/based-build", optional = true }

[dependencies]
based-runtime = { path = "../../../crates/based-runtime", optional = true, features = ["sqlite", "id-gen"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", optional = true, features = ["v4"] }
