[package]
name = "cargo-generation-consumer"
version = "0.0.0"
edition = "2021"

[workspace]

[build-dependencies]
based-build = { path = "../../../crates/based-build" }

[dependencies]
based-runtime = { path = "../../../crates/based-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
