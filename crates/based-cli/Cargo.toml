[package]
name = "based-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "based"
path = "src/main.rs"

[features]
# The installed CLI keeps every database driver. Local infra-free checks disable
# these defaults; SQLite and the HTTP listener remain available in that build.
default = ["mariadb", "postgres"]
mariadb = ["based-runtime/mariadb", "based-runtime/tls-rustls"]
postgres = ["based-runtime/postgres", "based-runtime/tls-rustls"]

[dependencies]
based-ast = { workspace = true }
based-diagnostics = { workspace = true }
based-manifest = { workspace = true }
based-parser = { workspace = true }
based-fmt = { workspace = true }
based-sema = { workspace = true }
based-codegen = { workspace = true }
based-facts = { workspace = true }
based-version = { workspace = true }
# The runtime, with the HTTP listener + SQLite (server drivers are default features), so `based serve` can
# stand the schema up as a live RPC service and `based migrate apply` can apply migrations
# against whichever dialect the manifest targets (MariaDB/SQLite/Postgres). The front-end
# commands — check/gen/facts/migrate gen|render — don't touch any of them.
based-runtime = { path = "../based-runtime", features = [
    "serve",
    "sqlite",
] }
# The binary owns the async runtime: execution (serve, migrate apply/status) is native
# async; the front-end commands just run on it.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
clap = { workspace = true }
dotenvy = "0.15"
# Graceful shutdown of `based serve`: catch SIGTERM/SIGINT and drain (principle 7 —
# reuse a hardened signal crate rather than hand-roll platform signal handling).
ctrlc = { workspace = true }

[lints]
workspace = true
