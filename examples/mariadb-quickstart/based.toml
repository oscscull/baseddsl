# based project manifest. `root` points the schema glob at `schema/`,
# so `migrations/` lives at the project root (sibling of the sources, migrations.md) and
# `based <cmd>` can run from here with the default `.` root.
dialect = "mariadb"
client  = "rust"
root    = "schema"

# `build.rs` generates the embedded client into `OUT_DIR`.
[generate]
client_mode = "embedded"
