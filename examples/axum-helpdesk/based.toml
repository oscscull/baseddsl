# based project manifest. `root` points the schema glob at `schema/`, so
# `migrations/` lives at the project root and `based <cmd>` runs from here.
dialect = "postgres"
client  = "rust"
root    = "schema"

# Checked-in generation (`based gen all`); the quickstarts use `build.rs` instead.
[generate]
client = "generated/client.rs"
client_mode = "embedded"
